<!DOCTYPE html>                 <!-- tells the web broswer that the document is written in html -->
<html lang="en">                <!-- the root element of a html document. language for the website is set to english-->
<head>                          <!-- the container for metadata-->
    <meta charset="UTF-8">      <!-- meta means Metadata and defines data about data interal in a document. charset is an attributeis required for this element to translate from binary. It allows broswers and search engines what to read, scale, or catagorize the page-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyron Magbujos | Portfolio Home</title>
    <!-- Below allows 3 of the separate CSS files to be linked -->
    <link rel="stylesheet" media="screen and (max-width: 600px)" href="mobile.css">
    <link rel="stylesheet" media="screen and (min-width: 601px) and (max-width: 1024px)" href="tablet.css">
    <link rel="stylesheet" media="screen and (min-width: 1025px)" href="desktop.css">
</head>
<body>
    <!-- 1f: Semantics that describes a content, in it are blocks. Semantics included are <header> and <nav>. This is also seen with the other html files via VS Code-->
        <header> <!-- the container for website logos, navigation menus, and introductory content -->
        <nav> <!-- the navigation elememnt is a semantic and defines the contents that includes major links in it -->
            <ul> <!-- ul means a unlisted item and defines an a list that does not matter. -->
                <!-- li means listed item and defines a item in a list (like ul) -->
                <!-- a means Anchor and href means Hypertext Reference. "a" acts as a container of the link while href is the direction to a site when clicked -->
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main>              <!-- The semantic element that represents the primary content -->
        <article>       <!-- this element represents a independent piece of content, like my portfolio within it. It can also be resusable unlike main -->
            <h1>Welcome to my Student Portfolio</h1>            <!-- The largest header -->
            <p>My name is Kyron Magbujos, and i'm currently a student studying at Ontario Tech University as an Networking and I.T Security Major</p>
        </article>
    </main>

    <!-- the footer element defines the Conclusion/Bottom section of a webpage (this is seen in the other 3 html programs) -->
    <footer>
        <p>Email: kyron.magbujos@ontariotechu.net</p>
        <p>&copy; 2026 Kyron Magbujos. All rights reserved.</p>
    </footer>
</body>
</html>
