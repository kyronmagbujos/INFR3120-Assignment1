    <main>
        <article>
            <h1>Contact Me</h1>
            <p>Please fill out the form below to get in touch with me regarding projects or inquiries.</p>

            <!-- 1d: Contact Form with Validation-->
            <form action="#" method="post">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required placeholder="Your Name"><br><br>

                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email" required placeholde="email@example.com"><br><br>

                <label for="phone">Cell No. (123-456-7890):</label><br>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required placeholder="123-456-7890"><br><br>

                <label for="comments">Comments:</label><br>
                <textarea id="comments" name="comments" rows="5" cols="40" required placeholder="Your message..."></textarea><br><br>

                <!-- Captcha for Human Verification -->
                <p>What is 2+2? (Human Verification)</p>
                <input type="number" name="captcha" required><br><br>

                <!-- Submit Button -->
                <button type="submit">Submit</button>
            </form>
        </article>
    </main>
